name: relock-temp

on:
  push:
    branches: ["chore/relock-**"]

permissions:
  contents: write

jobs:
  relock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
      - name: Upgrade lock file
        run: uv lock --upgrade
      - name: Verify
        run: |
          uv sync --dev
          uv run pytest tests/unit tests/test_timing.py -m "not integration" -q
          uv audit
      - name: Commit lock file
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git diff --cached --quiet || git commit -m "chore(deps): upgrade locked dependencies"
          git push
